
name: Crypto RSI Scanner

env:
  TELEGRAM_TOKEN: "[ĐIỀN_TOKEN_VÀO_ĐÂY]"
  TELEGRAM_CHAT_ID: "1353463391"

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas ta

      - name: Run scanner script
        run: python Scanner.py
